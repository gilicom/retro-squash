<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b0f16" />
  <meta name="description" content="Retro Squash: the 1984 arcade classic rebuilt in real 3D with real physics for desktop and mobile. Play against the computer and climb the world ranking." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Squash" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Retro Squash</title>
  <script type="module" crossorigin src="./assets/index-BCaDfA7j.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DVq4YW61.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="court3d" aria-label="Squash court"></canvas>
      <div id="webglError" class="overlay hidden"><div class="panel small"><h2 data-i18n="webglTitle"></h2><p class="sub" data-i18n="webglBody"></p></div></div>
    </div>

    <!-- New version banner (service worker update) -->
    <div id="updateBar" class="hidden" role="status">
      <span data-i18n="updateAvailable"></span>
      <button id="btnUpdate" class="primary" data-i18n="update"></button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="scoreboard">
        <div class="score">
          <div class="side you">
            <span class="dot" id="serveYou"></span>
            <span class="name" data-i18n="you">YOU</span>
            <span class="pts" id="ptsYou">0</span>
          </div>
          <div class="games" id="gamesLabel"></div>
          <div class="side cpu">
            <span class="pts" id="ptsCpu">0</span>
            <span class="name" data-i18n="cpu">CPU</span>
            <span class="dot" id="serveCpu"></span>
          </div>
        </div>
        <div class="stamina" title="Stamina">
          <div class="bar you"><i id="stYou"></i></div>
          <span class="label" data-i18n="stamina">STAMINA</span>
          <div class="bar cpu"><i id="stCpu"></i></div>
        </div>
      </div>
      <button id="btnPause" class="icon" aria-label="Pause">&#10074;&#10074;</button>
      <div id="demoBadge" class="hidden" data-i18n="demoBadge">DEMO</div>
      <div id="msg" class="hidden"></div>
      <div id="touchButtons">
        <button data-action="smash" class="smash" data-i18n="smash">SMASH</button>
        <button data-action="lob" data-i18n="lob">LOB</button>
        <button data-action="drop" data-i18n="drop">DROP</button>
      </div>
    </div>

    <!-- Main menu -->
    <div id="menu" class="overlay">
      <div class="panel">
        <h1 data-i18n="title">SQUASH</h1>
        <p class="sub" data-i18n="subtitle"></p>
        <button id="btnPlay" class="primary" data-i18n="play">Play</button>
        <div class="menu-row">
          <button id="btnRanking" data-i18n="ranking"></button>
          <button id="btnDemo" data-i18n="demo"></button>
        </div>
        <p id="playerLine" class="player-line hidden"></p>
        <button id="btnInstall" class="install hidden" data-i18n="install"></button>
        <p id="installHint" class="sub hidden" data-i18n="installHint"></p>

        <div class="settings">
          <div class="row">
            <label data-i18n="difficulty"></label>
            <div class="seg" data-key="difficulty">
              <button data-value="easy" data-i18n="easy"></button>
              <button data-value="normal" data-i18n="normal"></button>
              <button data-value="hard" data-i18n="hard"></button>
            </div>
          </div>
          <div class="row">
            <label data-i18n="pace"></label>
            <div class="seg" data-key="pace">
              <button data-value="relaxed" data-i18n="relaxed"></button>
              <button data-value="normal" data-i18n="normal"></button>
              <button data-value="fast" data-i18n="fast"></button>
            </div>
          </div>
          <div class="row">
            <label data-i18n="bestOf"></label>
            <div class="seg" data-key="bestOf">
              <button data-value="1" data-i18n="bestOf1"></button>
              <button data-value="3" data-i18n="bestOf3"></button>
              <button data-value="5" data-i18n="bestOf5"></button>
            </div>
          </div>
          <div class="row">
            <label data-i18n="autoT"></label>
            <div class="seg" data-key="autoT">
              <button data-value="true" data-i18n="on"></button>
              <button data-value="false" data-i18n="off"></button>
            </div>
          </div>
          <div class="row">
            <label data-i18n="sound"></label>
            <div class="seg" data-key="sound">
              <button data-value="true" data-i18n="on"></button>
              <button data-value="false" data-i18n="off"></button>
            </div>
          </div>
          <div class="row">
            <label data-i18n="language"></label>
            <div class="seg" data-key="lang">
              <button data-value="en">English</button>
              <button data-value="he">עברית</button>
            </div>
          </div>
        </div>

        <details class="help">
          <summary data-i18n="howToTitle"></summary>
          <p id="howTo"></p>
          <p data-i18n="staminaHelp"></p>
          <p data-i18n="rules"></p>
        </details>
        <p class="credits" data-i18n="credits"></p>
      </div>
    </div>

    <!-- Nickname (first play, or "change name") -->
    <div id="nickname" class="overlay hidden">
      <form class="panel small" id="nicknameForm" autocomplete="off">
        <h2 data-i18n="nicknameTitle"></h2>
        <p class="sub" data-i18n="nicknameBody"></p>
        <input id="nicknameInput" type="text" maxlength="16" minlength="2" required autocapitalize="words" enterkeyhint="done" />
        <p id="nicknameError" class="error hidden"></p>
        <button type="submit" class="primary" data-i18n="save"></button>
        <button type="button" id="btnNicknameCancel" class="hidden" data-i18n="close"></button>
      </form>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard" class="overlay hidden">
      <div class="panel board">
        <h2 data-i18n="ranking"></h2>
        <p id="boardMe" class="board-me"></p>
        <p id="boardStatus" class="sub"></p>
        <div class="board-scroll">
          <table class="board-table">
            <thead>
              <tr><th data-i18n="rank"></th><th class="name" data-i18n="player"></th><th data-i18n="rating"></th><th data-i18n="matches"></th><th data-i18n="wins"></th></tr>
            </thead>
            <tbody id="boardBody"></tbody>
          </table>
        </div>
        <div class="menu-row">
          <button id="btnBoardRefresh" data-i18n="refresh"></button>
          <button id="btnChangeName" data-i18n="changeName"></button>
          <button id="btnBoardClose" class="primary" data-i18n="close"></button>
        </div>
      </div>
    </div>

    <!-- Pause -->
    <div id="pause" class="overlay hidden">
      <div class="panel small">
        <h2 data-i18n="paused"></h2>
        <button id="btnResume" class="primary" data-i18n="resume"></button>
        <button id="btnRestart" data-i18n="restart"></button>
        <button id="btnMenu" data-i18n="menu"></button>
      </div>
    </div>

    <!-- Game / match over -->
    <div id="gameover" class="overlay hidden">
      <div class="panel small">
        <h2 id="goTitle"></h2>
        <p id="goBody" class="sub"></p>
        <p id="goRank" class="rank-line hidden"></p>
        <button id="btnContinue" class="primary"></button>
        <button id="btnMenu2" data-i18n="menu"></button>
      </div>
    </div>
  </div>
</body>
</html>
